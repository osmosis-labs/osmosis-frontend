name: Server E2E Workflow

on:
  workflow_dispatch:
  push:

# A newer push to the same branch supersedes this run. Stage and master runs are
# keyed on their commit, and manual runs are kept apart from push runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/master') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stage' && github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Server E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.x

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: ${{ runner.OS }}-24.x-${{ hashFiles('yarn.lock', 'package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.OS }}-24.x-

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Cache Turbo build
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.OS }}-turbo-build-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig.json', 'tsconfig.json', 'turbo.json', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.OS }}-turbo-build-

      - name: Run production server E2E tests
        id: prod
        continue-on-error: true
        run: |
          echo "SQS Server URL: https://sqs.osmosis.zone"
          corepack yarn test:e2e --filter=@osmosis-labs/server
        env:
          NEXT_PUBLIC_SIDECAR_BASE_URL: https://sqs.osmosis.zone
          NEXT_PUBLIC_TIMESERIES_DATA_URL: https://data.app.osmosis.zone

      - name: Run staging server E2E tests
        id: stage
        if: github.ref != 'refs/heads/master'
        continue-on-error: true
        run: |
          echo "SQS Server URL: https://sqs.stage.osmosis.zone"
          corepack yarn test:e2e --filter=@osmosis-labs/server
        env:
          NEXT_PUBLIC_SIDECAR_BASE_URL: https://sqs.stage.osmosis.zone
          NEXT_PUBLIC_TIMESERIES_DATA_URL: https://data.app.osmosis.zone

      - name: Check server E2E outcomes
        if: steps.prod.outcome == 'failure' || steps.stage.outcome == 'failure'
        run: |
          echo "production: ${{ steps.prod.outcome }}, staging: ${{ steps.stage.outcome }}"
          exit 1
