name: Check E2E Account Balances

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-balances:
    name: ${{ matrix.account.label }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account:
          - label: E2E Test Account
            key_id: e2e
          - label: Monitoring US
            key_id: us
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /yarn.lock
            /.yarnrc.yml
            /.yarn-4.12.0.cjs
            /packages/*/package.json
            /packages/e2e/
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.x
      - name: Install dependencies
        run: yarn workspaces focus app-osmosis-e2e
      - name: Resolve private key
        env:
          KEY_ID: ${{ matrix.account.key_id }}
          PK_PREVIEW: ${{ secrets.E2E_PRIVATE_KEY_PREVIEW }}
          PK_US: ${{ secrets.TEST_PRIVATE_KEY_US }}
        run: |
          case "$KEY_ID" in
            e2e) echo "PRIVATE_KEY=$PK_PREVIEW" >> "$GITHUB_ENV" ;;
            us)  echo "PRIVATE_KEY=$PK_US" >> "$GITHUB_ENV" ;;
            *)
              echo "Unknown key_id: $KEY_ID" >&2
              exit 1
              ;;
          esac
      - name: Check balances
        env:
          ACCOUNT_LABEL: ${{ matrix.account.label }}
        run: yarn --cwd packages/e2e check-balances || true
