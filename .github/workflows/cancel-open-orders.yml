name: Cancel Open Limit Orders (E2E Test Accounts)

# Manually triggered workflow to cancel all open limit orders for the preview
# e2e test account.
#
# Defaults to dry run (no transactions sent). Uncheck "Dry run" to send real cancel transactions.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no transactions sent)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cancel-limit-orders:
    name: "${{ inputs.dry_run && 'Dry run' || 'Cancel orders' }} — ${{ matrix.account.label }}"
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        account:
          - label: "E2E Test Account"
            key_id: e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /yarn.lock
            /.yarnrc.yml
            /.yarn-4.12.0.cjs
            /packages/*/package.json
            /packages/e2e/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.x

      - name: Install dependencies
        run: yarn workspaces focus app-osmosis-e2e

      - name: Resolve private key
        env:
          KEY_ID: ${{ matrix.account.key_id }}
          PK_PREVIEW: ${{ secrets.E2E_PRIVATE_KEY_PREVIEW }}
        run: |
          case "$KEY_ID" in
            e2e) echo "PRIVATE_KEY=$PK_PREVIEW" >> "$GITHUB_ENV" ;;
            *)
              echo "Unknown key_id: $KEY_ID" >&2
              exit 1
              ;;
          esac

      - name: Cancel open limit orders
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
          ACCOUNT_LABEL: ${{ matrix.account.label }}
        run: npx tsx packages/e2e/scripts/cancel-all-orders.ts
