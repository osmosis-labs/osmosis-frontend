name: Assetlist deploy

# Rebuilds the Cloudflare Workers so they pick up the latest osmosis-labs/assetlists
# lists. The lists are generated into the bundle at build time (generate-lists.ts),
# so redeploying an existing Worker version doesn't refresh them; only a new
# cf-deploy.yml run does.
#
#   schedule (daily 15:00 UTC) -> runs cf-deploy.yml on stage and master, but only
#                                 if the mainnet frontend lists changed in the last
#                                 26 hours. assetlists generates and auto-merges at
#                                 14:30 UTC.
#   workflow_dispatch          -> runs cf-deploy.yml on stage and master regardless.
#
# Scheduled workflows run from the default branch (stage), which is why this
# dispatches rather than running the deploy itself. GITHUB_TOKEN can dispatch
# workflows in this repo, so no extra credential is needed.

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check for assetlist changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: deploying regardless of changes"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since=$(date -u -d '26 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=0
          for path in osmosis-1/generated/frontend/assetlist.json osmosis-1/generated/frontend/chainlist.json; do
            n=$(gh api "repos/osmosis-labs/assetlists/commits?sha=main&path=$path&since=$since&per_page=1" --jq length)
            count=$((count + n))
          done
          if [ "$count" -gt 0 ]; then
            echo "Assetlist changed since $since: deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No assetlist changes since $since: skipping"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy stage
        if: steps.changes.outputs.deploy == 'true'
        run: gh workflow run cf-deploy.yml --ref stage

      - name: Deploy master
        if: steps.changes.outputs.deploy == 'true'
        run: |
          # cf-deploy.yml reaches master with the first Cloudflare release.
          # Skip only on a 404; any other API error fails the step.
          if ! err=$(gh api "repos/$GH_REPO/contents/.github/workflows/cf-deploy.yml?ref=master" --silent 2>&1); then
            if [[ "$err" == *"HTTP 404"* ]]; then
              echo "::notice::cf-deploy.yml is not on master yet; skipping the production deploy"
              exit 0
            fi
            echo "$err" >&2
            exit 1
          fi
          gh workflow run cf-deploy.yml --ref master
