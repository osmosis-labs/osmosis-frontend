name: Lint and Check Format Workflow

on: [push]

# A newer push to the same branch supersedes this run. Stage and master runs are
# keyed on their commit, so they never cancel or queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/master') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stage' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.x

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: ${{ runner.OS }}-24.x-${{ hashFiles('yarn.lock', 'package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.OS }}-24.x-

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Lint workspace
        run: corepack yarn lint:workspace

      - name: Lint all packages
        run: corepack yarn lint --filter='!app-osmosis-e2e'

  typecheck-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.x

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: ${{ runner.OS }}-24.x-${{ hashFiles('yarn.lock', 'package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.OS }}-24.x-

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Cache Turbo build
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.OS }}-turbo-build-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig.json', 'tsconfig.json', 'turbo.json', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.OS }}-turbo-build-

      # Web resolves workspace packages through their build/ output and imports generated config.
      - name: Build workspace packages
        run: corepack yarn turbo run build --filter=@osmosis-labs/web^...

      # generate queries the GitHub API for the latest assetlists commit; the
      # token avoids the unauthenticated rate limit shared across runners.
      - name: Generate web config
        run: corepack yarn workspace @osmosis-labs/web generate
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_ASSET_IMAGES: "true"

      # Replaces the type check skipped by `next build` (see next.config.js),
      # and also covers test files, which `next build` skipped and Jest (swc) never checks.
      - name: Type check web
        run: corepack yarn workspace @osmosis-labs/web typecheck
