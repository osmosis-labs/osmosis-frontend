name: Cloudflare deploy (stage)

# Deploys osmosis-frontend-api-stage and osmosis-frontend-stage on every push
# to stage. Values come from the `cloudflare-stage` environment (see
# cf-deploy.yml for the list).
on:
  push:
    branches: [stage]
  workflow_dispatch:

# Queue deploys instead of cancelling one midway; the newest push still lands last.
concurrency:
  group: cf-deploy-stage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/cf-deploy.yml
    with:
      environment: cloudflare-stage
    secrets: inherit
