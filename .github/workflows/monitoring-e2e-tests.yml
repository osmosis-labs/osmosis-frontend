name: Synthetic Monitoring Server tests

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          echo "matrix={\"include\":[{ \"server-url\":\"https://sqs.osmosis.zone\", \"env\": \"production\", \"timeseries-url\":\"https://data.app.osmosis.zone\"}, { \"server-url\":\"https://sqs.stage.osmosis.zone\", \"env\": \"staging\", \"timeseries-url\":\"https://data.app.osmosis.zone\"}]}" >> "$GITHUB_OUTPUT"

  server-e2e-tests:
    name: ${{ matrix.env }}-server-tests
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.setup-matrix.outputs.matrix)}}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.x

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: ${{ runner.OS }}-24.x-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.OS }}-24.x-

      - name: Install Dependencies
        run: corepack yarn install --immutable

      - name: Echo Current Server URL
        run: echo "SQS Server URL:${{ matrix.server-url }}"

      - name: Run Tests
        id: tests
        run: corepack yarn test:e2e --filter=@osmosis-labs/server
        env:
          NEXT_PUBLIC_SIDECAR_BASE_URL: ${{ matrix.server-url }}
          NEXT_PUBLIC_TIMESERIES_DATA_URL: ${{ matrix.timeseries-url }}

      - name: Verify Datadog CI Installation
        if: failure() && github.run_attempt == 1 
        run: |
          echo "🔍 Verifying Datadog CI installation..."
          datadog-ci version
          echo "✅ Datadog CI is ready to use"
  
      - name: Send Datadog alert if test fails
        if: failure() && github.run_attempt == 1 
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_APP_KEY: ${{ secrets.DATADOG_APPLICATION_KEY }}
          DD_SITE: ${{ secrets.DATADOG_SITE }}
        run: |
          echo "🔍 Sending critical failure metrics to Datadog..."
          
          # Add custom tag to mark this as a critical failure (2nd attempt with multiple failures)
          datadog-ci tag --level pipeline --tags "critical_failure:true" --tags "dd_gh_run_attempt:${{ github.run_attempt }}"

          echo "✅ Metrics sent to Datadog successfully"

  delete-deployments:
    runs-on: ubuntu-latest
    if: always()
    needs: [server-e2e-tests]
    steps:
      - name: Delete Previous deployments
        uses: actions/github-script@v8
        with:
          debug: true
          script: |
            const deployments = await github.rest.repos.listDeployments({
               owner: context.repo.owner,
               repo: context.repo.repo,
               sha: context.sha
             });
             await Promise.all(
               deployments.data.map(async (deployment) => {
                 await github.rest.repos.createDeploymentStatus({ 
                   owner: context.repo.owner, 
                   repo: context.repo.repo, 
                   deployment_id: deployment.id, 
                   state: 'inactive' 
                 });
                 return github.rest.repos.deleteDeployment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id
                });
               })
             );
